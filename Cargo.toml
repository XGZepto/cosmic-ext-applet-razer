[package]
name = "cosmic-ext-applet-razer"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
description = "COSMIC panel applet for Razer laptop settings (performance, fans, lighting, battery limit)"
license = "GPL-3.0-only"
repository = "https://github.com/XGZepto/cosmic-ext-applet-razer"
readme = "README.md"
keywords = ["cosmic", "applet", "razer", "laptop", "hidraw"]
categories = ["hardware-support"]
publish = false

[dependencies]
libc = "0.2"
tokio = { version = "1", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
default-features = false
features = ["applet", "applet-token", "multi-window", "tokio", "wayland", "winit"]

[profile.release]
lto = "thin"
opt-level = 3
