[package]
name = "cosmic-ext-applet-razer"
version = "0.1.0"
edition = "2021"
description = "COSMIC panel applet for Razer laptop settings (performance, fans, lighting, battery limit)"
license = "MIT"

[dependencies]
libc = "0.2"
tokio = { version = "1", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
default-features = false
features = ["applet", "applet-token", "multi-window", "tokio", "wayland", "winit"]

[profile.release]
lto = "thin"
opt-level = 3
